    Selected Research Contributions:
      - bullet: "**Reliable automated assessment and feedback.** Automated essay scoring usually depends on task-specific training and gives little explanation for its scores. As first author, I designed and evaluated MADRAG (NLP4DH 2026): an Advocate and a Skeptic agent debate an essay's strengths and weaknesses, and a Judge agent calibrates its score against retrieved, rubric-aligned scored examples, without fine-tuning. MADRAG outperforms prompt-based baselines and approaches supervised systems. Related first-authored work adds teacher-in-the-loop feedback (CSCL 2026) and shows that LoRA fine-tuning of an 8-billion-parameter model, ordered by essay structure, outperforms a general LLaMA-70B baseline on conclusion scoring (arXiv preprint)."
      - bullet: "**Measuring reasoning quality in multi-agent LLM systems.** Multi-agent LLM systems are usually judged only by their final answers. As first author, I designed the debate frameworks and confidence analyses in the ACL 2026 Student Research Workshop and GEM 2026 papers. In rubric-based essay scoring, token-level confidence detected the critical reasoning failures flagged by an LLM judge with an AUROC of 0.804 for the constructing agent versus 0.634 for the auditing agent (ACL 2026 SRW); on two ASAP essay sets, confidence over the first few generated tokens was the strongest predictor of LLM-judged reasoning quality, outperforming full-sequence statistics (GEM 2026)."
      - bullet: "**Reliability benchmarks for tool-using AI agents.** Agent benchmarks often credit a single successful run. At Microsoft, I contributed to ThinkingBox, a sandbox that grades agents by executable checks on the final system state, and co-developed ThinkingBox-Bench, 507 policy-conditioned business workflows, building the user simulator and the LLM judges that evaluate agents; co-first author of the paper (arXiv preprint). Across 20 repeated attempts per task, the top-scoring model's success fell from 66.5% on a single attempt to 47.5% when it had to succeed on all 20."
      - bullet: "**Simulated learners.** Collecting representative student errors for a new programming task normally takes extensive classroom deployment. As co-first author, I designed the Self-Refine student simulator and the syntax-tree and tree-edit-distance evaluation in the EDM 2026 paper, comparing five LLMs and three prompting strategies against 74,080 authentic Java submissions. In blinded expert annotation, 164 of 196 erroneous submissions generated by the selected model (Claude Sonnet 4 with Self-Refine) were judged human-written (83.7%), although the synthetic and authentic error distributions differed in shape."

